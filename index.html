<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>مرغداری وحید V22</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#111827;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow:hidden;
}
button{
    border:0;
    border-radius:12px;
    padding:11px 14px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}
#app{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}
#top{
    min-height:72px;
    background:#172033;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px;
    overflow-x:auto;
    z-index:10;
}
.stat{
    background:#243047;
    border-radius:10px;
    padding:7px 10px;
    white-space:nowrap;
    font-size:12px;
}
#content{
    flex:1;
    position:relative;
    overflow:hidden;
}
canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}
#bottom{
    min-height:64px;
    background:#172033;
    display:flex;
    gap:6px;
    padding:6px;
    overflow-x:auto;
    z-index:20;
}
.nav{
    min-width:76px;
    background:#26344e;
    color:white;
}
.nav.active{
    background:#16a34a;
}
#panel{
    position:absolute;
    inset:10px;
    background:rgba(15,23,42,.97);
    border:1px solid #475569;
    border-radius:18px;
    padding:15px;
    overflow:auto;
    z-index:30;
    display:none;
}
#panel h2{
    margin-top:0;
}
.close{
    float:left;
    background:#dc2626;
    color:#fff;
}
.card{
    background:#1e293b;
    padding:13px;
    border-radius:13px;
    margin:8px 0;
}
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:7px 0;
    border-bottom:1px solid #334155;
}
.green{color:#4ade80}
.yellow{color:#facc15}
.red{color:#f87171}
.blue{color:#60a5fa}
.small{font-size:12px;color:#cbd5e1}
.action{
    background:#2563eb;
    color:white;
}
.danger{
    background:#dc2626;
    color:white;
}
.success{
    background:#16a34a;
    color:white;
}
.dark{
    background:#334155;
    color:white;
}
input{
    width:100%;
    background:#0f172a;
    color:white;
    border:1px solid #475569;
    border-radius:10px;
    padding:10px;
    margin:5px 0;
}
#joystick{
    position:absolute;
    left:20px;
    bottom:20px;
    width:110px;
    height:110px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);
    z-index:15;
}
#stick{
    position:absolute;
    width:48px;
    height:48px;
    left:29px;
    top:29px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
}
</style>
</head>

<body>
<div id="app">

<div id="top">
    <div class="stat">🐔 مرغ: <b id="sChickens">100</b></div>
    <div class="stat">🌾 خوراک: <b id="sFeed">100</b> kg</div>
    <div class="stat">💧 آب: <b id="sWater">100</b></div>
    <div class="stat">🥚 تخم‌مرغ: <b id="sEggs">0</b></div>
    <div class="stat">🪙 توکن: <b id="sCoins">300</b></div>
    <div class="stat">📅 روز: <b id="sDay">1</b></div>
</div>

<div id="content">

<canvas id="game"></canvas>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="panel"></div>

</div>

<div id="bottom">
    <button class="nav active" onclick="showFarm()">🏡<br>مزرعه</button>
    <button class="nav" onclick="showProfile()">👤<br>پروفایل</button>
    <button class="nav" onclick="showSocial()">👥<br>اجتماعی</button>
    <button class="nav" onclick="showRank()">🏆<br>رتبه‌بندی</button>
    <button class="nav" onclick="showMarket()">🛒<br>بازار</button>
    <button class="nav" onclick="showWallet()">💰<br>کیف پول</button>
    <button class="nav" onclick="showNotifications()">🔔<br>اعلان‌ها</button>
    <button class="nav" onclick="showReferral()">🎁<br>دعوت</button>
    <button class="nav" onclick="showSettings()">⚙️<br>تنظیمات</button>
</div>

</div>

<script>
/* =========================
   STATE
========================= */

const SAVE_KEY="vahid_chicken_v22";

let state=JSON.parse(localStorage.getItem(SAVE_KEY)||"null")||{
    day:1,
    chickens:100,
    feed:100,
    water:100,
    eggs:0,
    coins:300,

    level:1,
    username:"vahid",
    farmName:"مزرعه وحید",

    followers:0,
    following:0,

    totalEggs:0,
    totalDays:0,
    health:100,

    fedMorning:false,
    fedEvening:false,
    wateredMorning:false,
    wateredEvening:false,

    feedShortageDays:0,
    waterShortageDays:0,

    feedStorage:1000,
    coldStorage:1500,

    notifications:[
        "🎉 به مزرعه مرغداری وحید خوش آمدی."
    ],

    adsWatched:0,

    referralCode:"VAHID100",

    farmClean:true,
    feedStoreClean:true,
    coldStoreClean:true
};

function save(){
    localStorage.setItem(SAVE_KEY,JSON.stringify(state));
    updateStats();
}

function updateStats(){
    sChickens.textContent=state.chickens;
    sFeed.textContent=Math.floor(state.feed);
    sWater.textContent=Math.floor(state.water);
    sEggs.textContent=Math.floor(state.eggs);
    sCoins.textContent=Math.floor(state.coins);
    sDay.textContent=state.day;
}

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0;

const world={
    w:2200,
    h:1500
};

const player={
    x:1100,
    y:780,
    speed:5,
    r:22
};

let chickens=[];

for(let i=0;i<100;i++){
    chickens.push({
        x:760+Math.random()*420,
        y:520+Math.random()*170,
        dx:(Math.random()-.5),
        dy:(Math.random()-.5)
    });
}

let camera={
    x:0,
    y:0
};

/* =========================
   RESIZE
========================= */

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight-136;
}
window.addEventListener("resize",resize);
resize();

/* =========================
   DRAW
========================= */

function drawBackground(){

    ctx.fillStyle="#75b84a";
    ctx.fillRect(0,0,world.w,world.h);

    // زمین
    ctx.fillStyle="#69a83f";
    for(let x=0;x<world.w;x+=120){
        for(let y=0;y<world.h;y+=120){
            ctx.fillRect(x+5,y+5,100,100);
        }
    }

    // جاده
    ctx.fillStyle="#b99b70";
    ctx.fillRect(0,690,world.w,110);
    ctx.fillRect(1020,0,110,world.h);

    // رودخانه
    ctx.fillStyle="#4aa3df";
    ctx.fillRect(0,1180,world.w,180);

    drawBuilding(720,250,520,230,"🏠","مرغداری");
    drawBuilding(1450,300,350,220,"🌾","انبار خوراک");
    drawBuilding(1450,600,350,200,"❄️","سردخانه");
    drawBuilding(350,350,300,200,"🏢","دفتر");

    // تابلو
    ctx.fillStyle="#4b2e1f";
    ctx.fillRect(850,1050,500,100);

    ctx.fillStyle="#fff";
    ctx.font="bold 38px Tahoma";
    ctx.textAlign="center";
    ctx.fillText(state.farmName,1100,1115);
}

function drawBuilding(x,y,w,h,icon,name){

    ctx.fillStyle="#8b5a2b";
    ctx.fillRect(x,y,w,h);

    ctx.fillStyle="#6d3e1d";
    ctx.fillRect(x+20,y+20,w-40,55);

    ctx.fillStyle="#fff";
    ctx.font="50px Arial";
    ctx.textAlign="center";
    ctx.fillText(icon,x+w/2,y+135);

    ctx.font="bold 24px Tahoma";
    ctx.fillText(name,x+w/2,y+180);
}

function drawChickens(){

    chickens.forEach(c=>{

        c.x+=c.dx;
        c.y+=c.dy;

        if(c.x<720||c.x>1240)c.dx*=-1;
        if(c.y<480||c.y>700)c.dy*=-1;

        ctx.font="26px Arial";
        ctx.textAlign="center";
        ctx.fillText("🐔",c.x,c.y);
    });
}

function drawPlayer(){

    ctx.save();

    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r+7,0,Math.PI*2);
    ctx.fillStyle="rgba(37,99,235,.25)";
    ctx.fill();

    ctx.font="38px Arial";
    ctx.textAlign="center";
    ctx.fillText("🧑",player.x,player.y+10);

    ctx.font="bold 16px Tahoma";
    ctx.fillStyle="#fff";
    ctx.fillText(state.username,player.x,player.y-32);

    ctx.restore();
}

function render(){

    ctx.clearRect(0,0,W,H);

    camera.x=player.x-W/2;
    camera.y=player.y-H/2;

    camera.x=Math.max(0,Math.min(world.w-W,camera.x));
    camera.y=Math.max(0,Math.min(world.h-H,camera.y));

    ctx.save();
    ctx.translate(-camera.x,-camera.y);

    drawBackground();
    drawChickens();
    drawPlayer();

    ctx.restore();

    requestAnimationFrame(render);
}

render();

/* =========================
   MOVEMENT
========================= */

let keys={};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

let joy={
    x:0,
    y:0,
    active:false
};

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

joystick.addEventListener("pointerdown",e=>{
    joy.active=true;
    joystick.setPointerCapture(e.pointerId);
    updateJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
    if(joy.active)updateJoystick(e);
});

joystick.addEventListener("pointerup",()=>{
    joy.active=false;
    joy.x=0;
    joy.y=0;
    stick.style.left="29px";
    stick.style.top="29px";
});

function updateJoystick(e){

    const r=joystick.getBoundingClientRect();

    let x=e.clientX-(r.left+r.width/2);
    let y=e.clientY-(r.top+r.height/2);

    const max=35;
    const d=Math.sqrt(x*x+y*y);

    if(d>max){
        x=x/d*max;
        y=y/d*max;
    }

    joy.x=x/max;
    joy.y=y/max;

    stick.style.left=(29+x)+"px";
    stick.style.top=(29+y)+"px";
}

/* =========================
   DIRECT CHARACTER DRAG
========================= */

let dragging=false;
let dragPointer=null;
let dragTarget=null;

canvas.addEventListener("pointerdown",e=>{

    const rect=canvas.getBoundingClientRect();

    const sx=e.clientX-rect.left;
    const sy=e.clientY-rect.top;

    const wx=sx+camera.x;
    const wy=sy+camera.y;

    const dx=wx-player.x;
    const dy=wy-player.y;

    if(Math.sqrt(dx*dx+dy*dy)<65){

        dragging=true;
        dragPointer=e.pointerId;

        dragTarget={
            x:wx,
            y:wy
        };

        canvas.setPointerCapture(e.pointerId);
    }
});

canvas.addEventListener("pointermove",e=>{

    if(!dragging || e.pointerId!==dragPointer)return;

    const rect=canvas.getBoundingClientRect();

    dragTarget={
        x:e.clientX-rect.left+camera.x,
        y:e.clientY-rect.top+camera.y
    };
});

canvas.addEventListener("pointerup",stopDrag);
canvas.addEventListener("pointercancel",stopDrag);

function stopDrag(e){

    if(e.pointerId===dragPointer){

        dragging=false;
        dragPointer=null;
        dragTarget=null;
    }
}

/* حرکت بازیکن */

function movePlayer(){

    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"])dy-=1;
    if(keys["s"]||keys["arrowdown"])dy+=1;
    if(keys["a"]||keys["arrowleft"])dx-=1;
    if(keys["d"]||keys["arrowright"])dx+=1;

    if(joy.active){
        dx+=joy.x;
        dy+=joy.y;
    }

    if(dragging && dragTarget){

        const tx=dragTarget.x-player.x;
        const ty=dragTarget.y-player.y;

        const d=Math.sqrt(tx*tx+ty*ty);

        if(d>8){
            dx+=tx/d;
            dy+=ty/d;
        }
    }

    const len=Math.sqrt(dx*dx+dy*dy);

    if(len>0){

        dx/=len;
        dy/=len;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;
    }

    player.x=Math.max(30,Math.min(world.w-30,player.x));
    player.y=Math.max(30,Math.min(world.h-30,player.y));
}

setInterval(movePlayer,16);

/* =========================
   PANELS
========================= */

const panel=document.getElementById("panel");

function openPanel(html){

    panel.innerHTML=`
        <button class="close" onclick="closePanel()">✕</button>
        ${html}
    `;

    panel.style.display="block";
}

function closePanel(){
    panel.style.display="none";
}

/* =========================
   FARM
========================= */

function showFarm(){

    closePanel();

    alert(
        "🏡 مزرعه فعال است.\n\n"+
        "🐔 مرغ‌ها: "+state.chickens+
        "\n🌾 خوراک: "+Math.floor(state.feed)+" کیلو"+
        "\n💧 آب: "+Math.floor(state.water)+
        "\n🥚 تخم‌مرغ: "+Math.floor(state.eggs)
    );
}

/* =========================
   FEED / WATER
========================= */

function feed(){

    if(state.feed<state.chickens*0.05){

        state.notifications.unshift("⚠️ خوراک کافی نیست.");
        save();

        alert("خوراک کافی نیست.");
        return;
    }

    state.feed-=state.chickens*0.05;
    state.fedMorning=true;

    state.notifications.unshift("🌾 خوراک‌دهی انجام شد.");

    save();
}

function water(){

    if(state.water<state.chickens*0.08){

        state.notifications.unshift("⚠️ آب کافی نیست.");
        save();

        alert("آب کافی نیست.");
        return;
    }

    state.water-=state.chickens*0.08;
    state.wateredMorning=true;

    state.notifications.unshift("💧 آب‌دهی انجام شد.");

    save();
}

function collectEggs(){

    state.eggs+=state.totalEggs||0;

    state.notifications.unshift(
        "🥚 تخم‌مرغ‌ها جمع‌آوری شدند."
    );

    save();
}

function produceEggs(){

    let production=state.chickens*.8;

    if(!state.fedMorning || !state.fedEvening)
        production*=.7;

    if(!state.wateredMorning || !state.wateredEvening)
        production*=.7;

    if(state.health<100)
        production*=state.health/100;

    state.eggs+=production;
    state.totalEggs+=production;
}

/* =========================
   END DAY
========================= */

function endDay(){

    state.fedEvening=true;
    state.wateredEvening=true;

    produceEggs();

    state.day++;
    state.totalDays++;

    state.fedMorning=false;
    state.fedEvening=false;
    state.wateredMorning=false;
    state.wateredEvening=false;

    state.notifications.unshift(
        "🌅 روز جدید شروع شد. روز "+state.day
    );

    save();

    alert(
        "روز جدید شروع شد!\n\n"+
        "🥚 تخم‌مرغ فعلی: "+Math.floor(state.eggs)
    );
}

/* =========================
   SELL EGGS
========================= */

function sellEggs(){

    if(state.eggs<=0){

        alert("تخم‌مرغی برای فروش نداری.");
        return;
    }

    const price=.9+Math.random()*.2;
    const amount=Math.floor(state.eggs);
    const revenue=amount*price;

    state.eggs-=amount;
    state.coins+=revenue;

    state.notifications.unshift(
        "💰 فروش "+amount+" تخم‌مرغ با قیمت "+
        price.toFixed(2)+" توکن انجام شد."
    );

    save();

    alert(
        "فروش انجام شد.\n\n"+
        "🥚 تعداد: "+amount+
        "\n💰 درآمد: "+revenue.toFixed(1)+" توکن"
    );
}

/* =========================
   PROFILE
========================= */

function showProfile(){

    openPanel(`
        <h2>👤 پروفایل من</h2>

        <div class="card">
            <div class="row">
                <span>نام کاربری</span>
                <b>${state.username}</b>
            </div>

            <div class="row">
                <span>نام مزرعه</span>
                <b>${state.farmName}</b>
            </div>

            <div class="row">
                <span>سطح مزرعه</span>
                <b>${state.level}</b>
            </div>

            <div class="row">
                <span>مرغ</span>
                <b>${state.chickens}</b>
            </div>

            <div class="row">
                <span>تولید کل تخم‌مرغ</span>
                <b>${Math.floor(state.totalEggs)}</b>
            </div>

            <div class="row">
                <span>روزهای فعالیت</span>
                <b>${state.totalDays}</b>
            </div>

            <div class="row">
                <span>دنبال‌کنندگان</span>
                <b>${state.followers}</b>
            </div>

            <div class="row">
                <span>دنبال‌شونده‌ها</span>
                <b>${state.following}</b>
            </div>
        </div>

        <button class="action" onclick="editProfile()">
            ✏️ ویرایش پروفایل
        </button>
    `);
}

function editProfile(){

    openPanel(`
        <h2>✏️ ویرایش پروفایل</h2>

        <label>نام کاربری</label>
        <input id="usernameInput" value="${state.username}">

        <label>نام مزرعه</label>
        <input id="farmInput" value="${state.farmName}">

        <button class="success" onclick="saveProfile()">
            💾 ذخیره
        </button>
    `);
}

function saveProfile(){

    state.username=document.getElementById("usernameInput").value||"vahid";
    state.farmName=document.getElementById("farmInput").value||"مزرعه وحید";

    save();
    showProfile();
}

/* =========================
   SOCIAL
========================= */

const demoPlayers=[
    {
        name:"رضا",
        farm:"مرغداری سبز",
        chickens:500,
        level:2
    },
    {
        name:"علی",
        farm:"مرغ طلایی",
        chickens:1000,
        level:3
    },
    {
        name:"محمد",
        farm:"مزرعه شمال",
        chickens:2000,
        level:4
    }
];

function showSocial(){

    openPanel(`
        <h2>👥 اجتماعی</h2>

        <div class="card">
            <input id="searchPlayer"
                   placeholder="جستجوی بازیکن..."
                   oninput="searchPlayers()">
        </div>

        <div id="playerList">
            ${renderPlayers(demoPlayers)}
        </div>

        <div class="card">
            <h3>💬 چت عمومی</h3>

            <div id="chatMessages">
                <p>رضا: سلام 👋</p>
                <p>علی: بازار امروز خوبه.</p>
                <p>محمد: کسی تخم‌مرغ می‌فروشه؟</p>
            </div>

            <input id="chatInput" placeholder="پیام...">

            <button class="action" onclick="sendChat()">
                ارسال
            </button>
        </div>
    `);
}

function renderPlayers(players){

    return players.map(p=>`
        <div class="card">
            <b>👤 ${p.name}</b>
            <div class="small">${p.farm}</div>

            <div class="row">
                <span>🐔 مرغ</span>
                <span>${p.chickens}</span>
            </div>

            <div class="row">
                <span>⭐ سطح</span>
                <span>${p.level}</span>
            </div>

            <button class="success"
                    onclick="followPlayer('${p.name}')">
                ➕ دنبال کردن
            </button>

            <button class="dark"
                    onclick="viewPlayer('${p.name}')">
                👁️ پروفایل
            </button>
        </div>
    `).join("");
}

function searchPlayers(){

    const q=document.getElementById("searchPlayer").value.trim();

    const result=demoPlayers.filter(p=>
        p.name.includes(q)||p.farm.includes(q)
    );

    document.getElementById("playerList").innerHTML=
        renderPlayers(result);
}

function followPlayer(name){

    state.following++;
    state.notifications.unshift(
        "👥 "+name+" را دنبال کردی."
    );

    save();

    alert("دنبال کردن انجام شد.");
}

function viewPlayer(name){

    const p=demoPlayers.find(x=>x.name===name);

    openPanel(`
        <h2>👤 پروفایل ${p.name}</h2>

        <div class="card">
            <h3>${p.farm}</h3>

            <div class="row">
                <span>🐔 مرغ</span>
                <b>${p.chickens}</b>
            </div>

            <div class="row">
                <span>⭐ سطح</span>
                <b>${p.level}</b>
            </div>

            <div class="row">
                <span>🥚 تولید روزانه تقریبی</span>
                <b>${Math.floor(p.chickens*.8)}</b>
            </div>
        </div>
    `);
}

function sendChat(){

    const input=document.getElementById("chatInput");

    if(!input||!input.value.trim())return;

    const box=document.getElementById("chatMessages");

    box.innerHTML+=
        `<p><b>${state.username}:</b> ${input.value}</p>`;

    input.value="";
}

/* =========================
   RANK
========================= */

function showRank(){

    const ranking=[
        {
            name:"رضا",
            value:85000
        },
        {
            name:"علی",
            value:62000
        },
        {
            name:"محمد",
            value:41000
        },
        {
            name:state.username,
            value:Math.floor(state.coins)
        }
    ].sort((a,b)=>b.value-a.value);

    openPanel(`
        <h2>🏆 رتبه‌بندی</h2>

        <div class="card">

        ${ranking.map((p,i)=>`
            <div class="row">
                <span>
                    ${i===0?"🥇":i===1?"🥈":i===2?"🥉":"🏅"}
                    ${p.name}
                </span>

                <b>${p.value.toLocaleString()} 🪙</b>
            </div>
        `).join("")}

        </div>

        <div class="small">
        در نسخه آنلاین، این بخش با بازیکنان واقعی و
        سرور اصلی بازی متصل خواهد شد.
        </div>
    `);
}

/* =========================
   MARKET
========================= */

function showMarket(){

    openPanel(`
        <h2>🛒 بازار</h2>

        <div class="card">
            <h3>🥚 فروش تخم‌مرغ</h3>

            <p>
                موجودی:
                <b>${Math.floor(state.eggs)}</b>
            </p>

            <button class="success"
                    onclick="sellEggs()">
                💰 فروش به بازار
            </button>
        </div>

        <div class="card">
            <h3>🌾 خرید خوراک</h3>

            <p>قیمت پایه: 30 توکن / 100 کیلو</p>

            <button class="action"
                    onclick="buyFeed()">
                خرید 100 کیلو
            </button>
        </div>

        <div class="card">
            <h3>🤝 بازار بازیکنان</h3>

            <p>🥚 تخم‌مرغ — 1.02 توکن</p>
            <button class="success"
                    onclick="buyPlayerEggs()">
                خرید
            </button>

            <p>🌾 خوراک — 31 توکن / 100kg</p>
            <button class="success"
                    onclick="buyPlayerFeed()">
                خرید
            </button>
        </div>
    `);
}

function buyFeed(){

    if(state.coins<30){

        alert("توکن کافی نیست.");
        return;
    }

    if(state.feed+100>state.feedStorage){

        alert("ظرفیت انبار کافی نیست.");
        return;
    }

    state.coins-=30;
    state.feed+=100;

    state.notifications.unshift(
        "🌾 100 کیلو خوراک خریداری شد."
    );

    save();
    showMarket();
}

function buyPlayerEggs(){

    if(state.coins<102){

        alert("توکن کافی نیست.");
        return;
    }

    state.coins-=102;
    state.eggs+=100;

    save();
    showMarket();
}

function buyPlayerFeed(){

    if(state.coins<31){

        alert("توکن کافی نیست.");
        return;
    }

    if(state.feed+100>state.feedStorage){

        alert("انبار جا ندارد.");
        return;
    }

    state.coins-=31;
    state.feed+=100;

    save();
    showMarket();
}

/* =========================
   WALLET
========================= */

function showWallet(){

    openPanel(`
        <h2>💰 کیف پول</h2>

        <div class="card">
            <h3>موجودی</h3>
            <div style="font-size:32px">
                ${Math.floor(state.coins)} 🪙
            </div>
        </div>

        <div class="card">
            <h3>خرید توکن</h3>

            <button class="action"
                    onclick="buyTokens(100)">
                100 توکن
            </button>

            <button class="action"
                    onclick="buyTokens(500)">
                500 توکن
            </button>

            <button class="action"
                    onclick="buyTokens(1000)">
                1000 توکن
            </button>
        </div>

        <div class="card">
            <h3>برداشت</h3>

            <p class="small">
                حداقل برداشت در نسخه اصلی:
                50,000 توکن
            </p>

            <button class="dark"
                    onclick="alert('در نسخه آنلاین برداشت به کیف پول/صرافی متصل می‌شود.')">
                درخواست برداشت
            </button>
        </div>
    `);
}

function buyTokens(amount){

    state.coins+=amount;

    state.notifications.unshift(
        "💰 "+amount+" توکن به‌صورت آزمایشی اضافه شد."
    );

    save();

    alert(
        amount+
        " توکن به‌صورت آزمایشی اضافه شد."
    );

    showWallet();
}

/* =========================
   NOTIFICATIONS
========================= */

function showNotifications(){

    openPanel(`
        <h2>🔔 اعلان‌ها</h2>

        <button class="danger"
                onclick="clearNotifications()">
            پاک کردن اعلان‌ها
        </button>

        <div class="card">

        ${
            state.notifications.length
            ?
            state.notifications.slice(0,90).map(n=>
                `<div class="row">${n}</div>`
            ).join("")
            :
            "<p>اعلانی وجود ندارد.</p>"
        }

        </div>
    `);
}

function clearNotifications(){

    state.notifications=[];
    save();

    showNotifications();
}

/* =========================
   REFERRAL
========================= */

function showReferral(){

    openPanel(`
        <h2>🎁 دعوت دوستان</h2>

        <div class="card">

            <p>
                کد دعوت تو:
            </p>

            <h2 class="green">
                ${state.referralCode}
            </h2>

            <p class="small">
                حداکثر 10 دعوت موفق قابل ثبت است.
            </p>

            <button class="action"
                    onclick="simulateReferral()">
                🎁 شبیه‌سازی دعوت موفق
            </button>

        </div>
    `);
}

function simulateReferral(){

    state.coins+=100;

    state.notifications.unshift(
        "🎁 پاداش دعوت موفق: 100 توکن"
    );

    save();

    alert("100 توکن پاداش گرفتی.");

    showReferral();
}

/* =========================
   SETTINGS
========================= */

function showSettings(){

    openPanel(`
        <h2>⚙️ تنظیمات</h2>

        <div class="card">

            <button class="dark"
                    onclick="cleanFarm()">
                🧹 نظافت مرغداری
            </button>

            <button class="dark"
                    onclick="cleanFeedStore()">
                🌾 نظافت انبار خوراک
            </button>

            <button class="dark"
                    onclick="cleanColdStore()">
                ❄️ نظافت سردخانه
            </button>

        </div>

        <div class="card">

            <button class="danger"
                    onclick="resetGame()">
                🗑️ شروع دوباره بازی
            </button>

        </div>

        <div class="small">
            نسخه بازی: V22
        </div>
    `);
}

function cleanFarm(){

    state.farmClean=true;

    state.notifications.unshift(
        "🧹 مرغداری تمیز شد."
    );

    save();

    alert("مرغداری تمیز شد.");
}

function cleanFeedStore(){

    state.feedStoreClean=true;

    state.notifications.unshift(
        "🧹 انبار خوراک تمیز شد."
    );

    save();

    alert("انبار خوراک تمیز شد.");
}

function cleanColdStore(){

    state.coldStoreClean=true;

    state.notifications.unshift(
        "🧹 سردخانه تمیز شد."
    );

    save();

    alert("سردخانه تمیز شد.");
}

function resetGame(){

    if(!confirm("تمام پیشرفت بازی پاک شود؟"))return;

    localStorage.removeItem(SAVE_KEY);
    location.reload();
}

/* =========================
   INITIAL
========================= */

updateStats();

</script>
