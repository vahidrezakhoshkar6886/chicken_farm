<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مرغداری وحید</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Tahoma, Arial, sans-serif;
      background: #eef5e9;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* ---------- AUTH ---------- */

    #authScreen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(rgba(238,245,233,.9), rgba(238,245,233,.96)),
        radial-gradient(circle at 30% 20%, #fff 0, transparent 35%);
      z-index: 50;
    }

    .auth-card {
      width: min(430px, 100%);
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 52px;
      margin-bottom: 5px;
    }

    .auth-title {
      text-align: center;
      margin: 0;
      color: #26352a;
    }

    .auth-subtitle {
      text-align: center;
      color: #718074;
      font-size: 13px;
      margin: 8px 0 22px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tabs button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 11px;
      background: #edf1ed;
      color: #536157;
    }

    .tabs button.active {
      background: #2f7d46;
      color: white;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #59665c;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      border: 1px solid #d6ded6;
      border-radius: 12px;
      padding: 12px;
      outline: none;
      background: #fafcf9;
    }

    .field input:focus {
      border-color: #2f7d46;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px;
      background: #2f7d46;
      color: white;
      font-weight: bold;
      margin-top: 5px;
    }

    .message {
      min-height: 20px;
      font-size: 12px;
      color: #b23a3a;
      margin: 8px 0;
      text-align: center;
    }

    /* ---------- GAME ---------- */

    #gameScreen {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #farmCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #topbar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .topbox {
      pointer-events: auto;
      background: rgba(255,255,255,.94);
      border-radius: 16px;
      padding: 8px 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,.12);
      font-size: 12px;
    }

    #menuButton {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      background: white;
      box-shadow: 0 5px 18px rgba(0,0,0,.12);
      font-size: 24px;
      pointer-events: auto;
    }

    #farmInfo {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .coin {
      color: #b78300;
      font-weight: bold;
    }

    #sideMenu {
      position: absolute;
      top: 62px;
      right: 10px;
      width: min(290px, calc(100% - 20px));
      max-height: calc(100% - 74px);
      overflow-y: auto;
      background: rgba(255,255,255,.98);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 10px 35px rgba(0,0,0,.18);
      z-index: 20;
      display: none;
    }

    .menu-title {
      padding: 10px;
      font-weight: bold;
      color: #2f4935;
    }

    .menu-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: right;
      padding: 13px;
      border-radius: 12px;
      color: #36433a;
    }

    .menu-item:hover {
      background: #eef5e9;
    }

    #bottomPanel {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(255,255,255,.94);
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .stat {
      background: #f2f6f1;
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
    }

    .stat strong {
      display: block;
      font-size: 15px;
      margin-top: 3px;
    }

    #actions {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }

    #actions button {
      flex: 1;
      border: 0;
      border-radius: 11px;
      padding: 10px 5px;
      background: #2f7d46;
      color: white;
      font-size: 11px;
    }

    /* ---------- MODAL ---------- */

    #modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 40;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-card {
      width: min(600px, 100%);
      max-height: 85%;
      overflow-y: auto;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 20px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-head button {
      border: 0;
      background: #f0f2f0;
      border-radius: 10px;
      width: 38px;
      height: 38px;
    }

    .card {
      background: #f5f8f4;
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 9px;
    }

    .danger {
      background: #b43d3d !important;
    }

    .success {
      color: #28723c;
    }

    .muted {
      color: #7a847c;
      font-size: 12px;
    }

    @media (min-width: 700px) {
      #bottomPanel {
        left: 20px;
        right: 20px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- AUTH -->
  <section id="authScreen">

    <div class="auth-card">

      <div class="logo">🐔</div>

      <h1 class="auth-title">مرغداری وحید</h1>

      <div class="auth-subtitle">
        ورود به مزرعه آنلاین
      </div>

      <div class="tabs">
        <button id="loginTab" class="active">ورود</button>
        <button id="registerTab">ثبت‌نام</button>
      </div>

      <div id="loginForm">

        <div class="field">
          <label>ایمیل، موبایل یا نام کاربری</label>
          <input id="loginIdentifier" autocomplete="username">
        </div>

        <div class="field">
          <label>رمز عبور</label>
          <input id="loginPassword" type="password" autocomplete="current-password">
        </div>

        <button class="primary" id="loginButton">
          ورود به بازی
        </button>

      </div>

      <div id="registerForm" style="display:none">

        <div class="field">
          <label>ایمیل</label>
          <input id="registerEmail" type="email">
        </div>

        <div class="field">
          <label>شماره موبایل</label>
          <input id="registerMobile" type="tel">
        </div>

        <div class="field">
          <label>نام کاربری</label>
          <input id="registerUsername">
        </div>

        <div class="field">
          <label>نام مزرعه</label>
          <input id="registerFarmName">
        </div>

        <div class="field">
          <label>رمز عبور حداقل ۸ کاراکتر</label>
          <input id="registerPassword" type="password">
        </div>

        <button class="primary" id="registerButton">
          ساخت حساب
        </button>

      </div>

      <div id="authMessage" class="message"></div>

    </div>

  </section>


  <!-- GAME -->
  <section id="gameScreen">

    <canvas id="farmCanvas"></canvas>

    <div id="topbar">

      <div id="farmInfo" class="topbox">
        <span id="playerName">بازیکن</span>
        <span class="coin">🪙 <span id="coins">0</span></span>
      </div>

      <button id="menuButton">☰</button>

    </div>


    <div id="sideMenu">

      <div class="menu-title">
        منوی مرغداری
      </div>

      <button class="menu-item" data-action="farm">
        🏡 مزرعه
      </button>

      <button class="menu-item" data-action="profile">
        👤 پروفایل
      </button>

      <button class="menu-item" data-action="social">
        👥 بازیکنان
      </button>

      <button class="menu-item" data-action="ranking">
        🏆 رتبه‌بندی
      </button>

      <button class="menu-item" data-action="market">
        🛒 بازار
      </button>

      <button class="menu-item" data-action="wallet">
        🪙 کیف پول
      </button>

      <button class="menu-item" data-action="notifications">
        🔔 اعلان‌ها
      </button>

      <button class="menu-item" data-action="referral">
        🎁 دعوت دوستان
      </button>

      <button class="menu-item" data-action="settings">
        ⚙️ تنظیمات
      </button>

      <button class="menu-item danger" data-action="logout">
        خروج
      </button>

    </div>


    <div id="bottomPanel">

      <div class="stats">

        <div class="stat">
          🐔 مرغ
          <strong id="chickens">0</strong>
        </div>

        <div class="stat">
          🥚 تخم‌مرغ
          <strong id="eggs">0</strong>
        </div>

        <div class="stat">
          🌾 خوراک
          <strong id="feed">0</strong>
        </div>

        <div class="stat">
          💧 آب
          <strong id="water">0</strong>
        </div>

      </div>

      <div id="actions">

        <button id="feedMorning">
          🌅 خوراک صبح
        </button>

        <button id="feedEvening">
          🌙 خوراک عصر
        </button>

        <button id="collectEggs">
          🥚 جمع‌آوری
        </button>

        <button id="endDay">
          📅 پایان روز
        </button>

      </div>

    </div>


    <div id="modal">

      <div class="modal-card">

        <div class="modal-head">
          <strong id="modalTitle">اطلاعات</strong>
          <button id="closeModal">✕</button>
        </div>

        <div id="modalBody"></div>

      </div>

    </div>

  </section>

</div>


<script>

  /*
    اتصال به سرور واقعی Render
  */

  const API_BASE =
    localStorage.getItem("chicken_api") ||
    "https://vahid-chicken-farm-server.onrender.com";


  let token =
    localStorage.getItem("chicken_token") || "";


  let player = null;
  let farm = null;


  const $ = id => document.getElementById(id);


  async function api(path, options = {}) {

    const headers = {
      "Content-Type": "application/json",
      ...(options.headers || {})
    };

    if (token) {
      headers.Authorization = "Bearer " + token;
    }

    const response = await fetch(API_BASE + path, {
      ...options,
      headers
    });

    let data = {};

    try {
      data = await response.json();
    } catch (_) {
      data = {};
    }

    if (!response.ok) {
      throw new Error(data.error || "خطای سرور");
    }

    return data;
  }


  function showAuthMessage(text, success = false) {

    $("authMessage").textContent = text;
    $("authMessage").style.color =
      success ? "#28723c" : "#b23a3a";
  }


  function openModal(title, html) {

    $("modalTitle").textContent = title;
    $("modalBody").innerHTML = html;
    $("modal").style.display = "flex";

  }


  function closeModal() {

    $("modal").style.display = "none";

  }


  $("closeModal").onclick = closeModal;


  $("modal").onclick = e => {

    if (e.target === $("modal")) {
      closeModal();
    }

  };


  $("loginTab").onclick = () => {

    $("loginTab").classList.add("active");
    $("registerTab").classList.remove("active");

    $("loginForm").style.display = "block";
    $("registerForm").style.display = "none";

    showAuthMessage("");

  };


  $("registerTab").onclick = () => {

    $("registerTab").classList.add("active");
    $("loginTab").classList.remove("active");

    $("loginForm").style.display = "none";
    $("registerForm").style.display = "block";

    showAuthMessage("");

  };


  $("loginButton").onclick = async () => {

    const identifier =
      $("loginIdentifier").value.trim();

    const password =
      $("loginPassword").value;

    if (!identifier || !password) {
      showAuthMessage("اطلاعات ورود را کامل کن.");
      return;
    }

    try {

      $("loginButton").disabled = true;

      const result = await api("/api/auth/login", {

        method: "POST",

        body: JSON.stringify({
          identifier,
          password
        })

      });

      token = result.token;

      localStorage.setItem(
        "chicken_token",
        token
      );

      await loadGame();

      showAuthMessage("");

    } catch (error) {

      showAuthMessage(error.message);

    } finally {

      $("loginButton").disabled = false;

    }

  };


  $("registerButton").onclick = async () => {

    const email =
      $("registerEmail").value.trim();

    const mobile =
      $("registerMobile").value.trim();

    const username =
      $("registerUsername").value.trim();

    const farmName =
      $("registerFarmName").value.trim();

    const password =
      $("registerPassword").value;

    if (
      !email ||
      !mobile ||
      !username ||
      !farmName ||
      !password
    ) {

      showAuthMessage(
        "همه اطلاعات را کامل وارد کن."
      );

      return;

    }


    if (password.length < 8) {

      showAuthMessage(
        "رمز عبور باید حداقل ۸ کاراکتر باشد."
      );

      return;

    }


    try {

      $("registerButton").disabled = true;

      const result = await api(
        "/api/auth/register",
        {

          method: "POST",

          body: JSON.stringify({
            email,
            mobile,
            username,
            farmName,
            password
          })

        }
      );


      token = result.token;

      localStorage.setItem(
        "chicken_token",
        token
      );


      await loadGame();


    } catch (error) {

      showAuthMessage(error.message);

    } finally {

      $("registerButton").disabled = false;

    }

  };


  async function loadGame() {

    try {

      const result =
        await api("/api/game/state");

      player = result.player;
      farm = result.farm;

      showGame();

    } catch (error) {

      token = "";

      localStorage.removeItem(
        "chicken_token"
      );

      showAuthMessage(
        "نشست شما معتبر نیست. دوباره وارد شوید."
      );

    }

  }


  function showGame() {

    $("authScreen").style.display = "none";
    $("gameScreen").style.display = "block";

    updateUI();
    drawFarm();

  }


  function updateUI() {

    if (!player || !farm) return;


    $("playerName").textContent =
      farm.name || player.username;


    $("coins").textContent =
      Number(player.tokens || 0).toLocaleString();


    $("chickens").textContent =
      Number(farm.chickens || 0).toLocaleString();


    $("eggs").textContent =
      Number(farm.eggs || 0).toLocaleString();


    $("feed").textContent =
      Number(farm.feed || 0).toLocaleString();


    $("water").textContent =
      Number(farm.water || 0).toLocaleString();

  }


  $("menuButton").onclick = () => {

    const menu = $("sideMenu");

    menu.style.display =
      menu.style.display === "block"
        ? "none"
        : "block";

  };


  document.querySelectorAll(".menu-item")
    .forEach(button => {

      button.onclick = async () => {

        $("sideMenu").style.display = "none";

        await menuAction(
          button.dataset.action
        );

      };

    });


  async function menuAction(action) {

    try {

      if (action === "farm") {

        openModal(
          "مزرعه",
          `
            <div class="card">
              <b>${escapeHtml(farm.name)}</b>
              <div class="muted">
                سطح مزرعه: ${farm.level}
              </div>
            </div>

            <div class="card">
              تعداد مرغ:
              <b>${Number(farm.chickens).toLocaleString()}</b>
            </div>

            <div class="card">
              خوراک:
              <b>${Number(farm.feed).toLocaleString()} kg</b>
            </div>

            <div class="card">
              آب:
              <b>${Number(farm.water).toLocaleString()} L</b>
            </div>
          `
        );

        return;

      }


      if (action === "profile") {

        openModal(
          "پروفایل",
          `
            <div class="card">
              نام کاربری:
              <b>${escapeHtml(player.username)}</b>
            </div>

            <div class="card">
              مزرعه:
              <b>${escapeHtml(farm.name)}</b>
            </div>

            <div class="card">
              سطح:
              <b>${farm.level}</b>
            </div>

            <div class="card">
              تعداد مرغ:
              <b>${Number(farm.chickens).toLocaleString()}</b>
            </div>
          `
        );

        return;

      }


      if (action === "social") {

        const result =
          await api(
            "/api/social/search?q="
            + encodeURIComponent(
              prompt("نام بازیکن را وارد کن:")
              || ""
            )
          );


        let html = "";

        if (!result.players.length) {

          html =
            `<div class="card">بازیکن واقعی پیدا نشد.</div>`;

        } else {

          result.players.forEach(p => {

            html += `
              <div class="card">
                <b>${escapeHtml(p.username)}</b>
                <div class="muted">
                  ${escapeHtml(p.farm_name)}
                </div>
              </div>
            `;

          });

        }

        openModal("بازیکنان", html);

        return;

      }


      if (action === "ranking") {

        const result =
          await api("/api/social/ranking");


        if (!result.players.length) {

          openModal(
            "رتبه‌بندی",
            `<div class="card">
              هنوز بازیکن واقعی ثبت نشده.
            </div>`
          );

          return;

        }


        let html = "";

        result.players.forEach((p, index) => {

          html += `
            <div class="card">
              #${index + 1}
              <b>${escapeHtml(p.username)}</b>
              <div class="muted">
                مرغ: ${Number(p.chickens).toLocaleString()}
                |
                سطح: ${p.level}
              </div>
            </div>
          `;

        });

        openModal("رتبه‌بندی واقعی", html);

        return;

      }


      if (action === "market") {

        const result =
          await api("/api/market");

        let html = "";

        if (!result.listings.length) {

          html =
            `<div class="card">
              در حال حاضر آگهی فعالی وجود ندارد.
            </div>`;

        } else {

          result.listings.forEach(item => {

            html += `
              <div class="card">
                <b>${escapeHtml(item.type)}</b>
                <div>
                  مقدار: ${Number(item.amount).toLocaleString()}
                </div>
                <div>
                  قیمت واحد:
                  ${Number(item.price).toLocaleString()}
                </div>
              </div>
            `;

          });

        }

        openModal("بازار", html);

        return;

      }


      if (action === "wallet") {

        const result =
          await api("/api/wallet");


        let html = `
          <div class="card">
            موجودی:
            <b class="coin">
              ${Number(result.balance).toLocaleString()}
            </b>
          </div>
        `;


        result.transactions.forEach(t => {

          html += `
            <div class="card">
              ${escapeHtml(t.description || "")}
              <div class="muted">
                ${Number(t.amount).toLocaleString()}
              </div>
            </div>
          `;

        });


        openModal("کیف پول", html);

        return;

      }


      if (action === "notifications") {

        const result =
          await api("/api/notifications");


        let html = "";

        if (!result.notifications.length) {

          html =
            `<div class="card">
              اعلان جدیدی وجود ندارد.
            </div>`;

        } else {

          result.notifications.forEach(n => {

            html += `
              <div class="card">
                <b>${escapeHtml(n.title)}</b>
                <div>
                  ${escapeHtml(n.body)}
                </div>
              </div>
            `;

          });

        }

        openModal("اعلان‌ها", html);

        return;

      }


      if (action === "referral") {

        const result =
          await api("/api/referral");

        openModal(
          "دعوت دوستان",
          `
            <div class="card">
              کد دعوت شما:
              <b>${escapeHtml(result.code)}</b>
            </div>

            <div class="card">
              دعوت موفق:
              <b>${result.successful}</b>
              از حداکثر ۱۰ نفر
            </div>
          `
        );

        return;

      }


      if (action === "settings") {

        openModal(
          "تنظیمات",
          `
            <div class="card">
              سرور:
              <div class="muted">
                ${escapeHtml(API_BASE)}
              </div>
            </div>

            <button
              class="primary"
              onclick="logoutAll()"
            >
              خروج از همه دستگاه‌ها
            </button>
          `
        );

        return;

      }


      if (action === "logout") {

        await api(
          "/api/auth/logout",
          {
            method: "POST"
          }
        );

        token = "";

        localStorage.removeItem(
          "chicken_token"
        );

        location.reload();

      }

    } catch (error) {

      openModal(
        "خطا",
        `<div class="card">${escapeHtml(error.message)}</div>`
      );

    }

  }


  async function logoutAll() {

    try {

      await api(
        "/api/auth/logout-all",
        {
          method: "POST"
        }
      );

    } catch (_) {}

    token = "";

    localStorage.removeItem(
      "chicken_token"
    );

    location.reload();

  }


  $("feedMorning").onclick =
    () => performAction(
      "/api/game/feed",
      "خوراک صبح"
    );


  $("feedEvening").onclick =
    () => performAction(
      "/api/game/feed",
      "خوراک عصر"
    );


  $("collectEggs").onclick =
    () => performAction(
      "/api/game/collect-eggs",
      "جمع‌آوری تخم‌مرغ"
    );


  $("endDay").onclick =
    () => performAction(
      "/api/game/end-day",
      "پایان روز"
    );


  async function performAction(
    path,
    title
  ) {

    try {

      const result =
        await api(
          path,
          {
            method: "POST"
          }
        );


      if (result.farm) {
        farm = result.farm;
      }

      if (result.player) {
        player = result.player;
      }

      updateUI();

      openModal(
        title,
        `
          <div class="card success">
            عملیات با موفقیت انجام شد.
          </div>

          <div class="card">
            ${escapeHtml(
              result.message || ""
            )}
          </div>
        `
      );

      drawFarm();

    } catch (error) {

      openModal(
        "خطا",
        `<div class="card">${escapeHtml(error.message)}</div>`
      );

    }

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* ---------- FARM CANVAS ---------- */

  const canvas =
    $("farmCanvas");

  const ctx =
    canvas.getContext("2d");


  let playerX = 0.5;
  let playerY = 0.5;

  let dragging = false;


  function resizeCanvas() {

    const dpr =
      Math.max(
        1,
        Math.min(
          2,
          window.devicePixelRatio || 1
        )
      );

    canvas.width =
      innerWidth * dpr;

    canvas.height =
      innerHeight * dpr;

    canvas.style.width =
      innerWidth + "px";

    canvas.style.height =
      innerHeight + "px";

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

    drawFarm();

  }


  window.addEventListener(
    "resize",
    resizeCanvas
  );


  function drawFarm() {

    const w = innerWidth;
    const h = innerHeight;

    ctx.clearRect(
      0,
      0,
      w,
      h
    );


    /* زمین */

    ctx.fillStyle =
      "#b9d995";

    ctx.fillRect(
      0,
      0,
      w,
      h
    );


    /* مسیر */

    ctx.fillStyle =
      "#d7c39a";

    ctx.beginPath();

    ctx.moveTo(
      w * .42,
      0
    );

    ctx.lineTo(
      w * .63,
      0
    );

    ctx.lineTo(
      w * .57,
      h
    );

    ctx.lineTo(
      w * .37,
      h
    );

    ctx.closePath();

    ctx.fill();


    /* مرغداری */

    const bx = w * .08;
    const by = h * .25;
    const bw = w * .34;
    const bh = h * .25;

    ctx.fillStyle =
      "#eee8d8";

    ctx.fillRect(
      bx,
      by,
      bw,
      bh
    );

    ctx.fillStyle =
      "#9e573e";

    ctx.beginPath();

    ctx.moveTo(
      bx - 15,
      by
    );

    ctx.lineTo(
      bx + bw / 2,
      by - 55
    );

    ctx.lineTo(
      bx + bw + 15,
      by
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
      "#65402f";

    ctx.fillRect(
      bx + bw * .4,
      by + bh * .48,
      bw * .2,
      bh * .52
    );


    /* انبار خوراک */

    ctx.fillStyle =
      "#d8b56b";

    ctx.fillRect(
      w * .70,
      h * .24,
      w * .22,
      h * .18
    );


    /* حوض آب */

    ctx.fillStyle =
      "#6db8d6";

    ctx.beginPath();

    ctx.ellipse(
      w * .78,
      h * .62,
      w * .12,
      h * .07,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();


    /* مرغ‌ها */

    const chickens =
      Math.min(
        25,
        Math.max(
          4,
          Number(farm?.chickens || 4) / 8
        )
      );


    for (
      let i = 0;
      i < chickens;
      i++
    ) {

      const cx =
        w * .10 +
        (i * 47) % (w * .78);

      const cy =
        h * .52 +
        ((i * 71) % Math.max(100, h * .30));

      drawChicken(
        cx,
        cy
      );

    }


    /* بازیکن */

    const px =
      w * playerX;

    const py =
      h * playerY;

    ctx.beginPath();

    ctx.fillStyle =
      "#365fbd";

    ctx.arc(
      px,
      py,
      16,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
      "white";

    ctx.font =
      "12px Tahoma";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "من",
      px,
      py - 24
    );

  }


  function drawChicken(x, y) {

    ctx.save();

    ctx.fillStyle =
      "#fffdf5";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y,
      15,
      11,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#e9b34f";

    ctx.beginPath();

    ctx.arc(
      x + 12,
      y - 7,
      7,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#c94d43";

    ctx.beginPath();

    ctx.arc(
      x + 13,
      y - 13,
      3,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#222";

    ctx.beginPath();

    ctx.arc(
      x + 14,
      y - 8,
      1.5,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

  }


  canvas.addEventListener(
    "pointerdown",
    e => {

      dragging = true;

      movePlayer(
        e.clientX,
        e.clientY
      );

    }
  );


  canvas.addEventListener(
    "pointermove",
    e => {

      if (!dragging) return;

      movePlayer(
        e.clientX,
        e.clientY
      );

    }
  );


  window.addEventListener(
    "pointerup",
    () => {

      dragging = false;

    }
  );


  function movePlayer(
    x,
    y
  ) {

    playerX =
      Math.max(
        .03,
        Math.min(
          .97,
          x / innerWidth
        )
      );

    playerY =
      Math.max(
        .10,
        Math.min(
          .90,
          y / innerHeight
        )
      );

    drawFarm();

  }


  /* ---------- START ---------- */

  resizeCanvas();


  if (token) {

    loadGame();

  } else {

    $("authScreen").style.display =
      "flex";

  }

</script>

</body>
</html>
