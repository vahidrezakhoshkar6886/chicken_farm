<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#173b24">
<title>مرغداری وحید</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,Arial,sans-serif;background:#8bcf68}
button,input{font-family:inherit}
button{cursor:pointer;border:0}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#8bcf68}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

#top{
 position:absolute;top:0;left:0;right:0;height:64px;
 display:flex;align-items:center;justify-content:space-between;
 padding:8px 10px;z-index:20;
 pointer-events:none
}
#top>*{pointer-events:auto}

#menuBtn{
 width:48px;height:48px;border-radius:14px;background:#173b24;
 color:#fff;font-size:27px;box-shadow:0 4px 12px #0004
}

#stats{
 display:flex;gap:5px;max-width:calc(100% - 60px);
 overflow-x:auto;direction:rtl
}
.stat{
 background:#ffffffdf;border-radius:12px;padding:7px 9px;
 font-size:11px;font-weight:bold;white-space:nowrap;
 box-shadow:0 3px 10px #0002
}

#menu{
 position:absolute;top:64px;right:10px;width:235px;
 background:#fff;border-radius:18px;padding:8px;
 box-shadow:0 10px 35px #0005;z-index:30;
 display:none
}
#menu.open{display:block}
.menuItem{
 width:100%;padding:13px 12px;margin:2px 0;
 background:#f4f6f4;border-radius:12px;text-align:right;
 font-size:14px
}
.menuItem:active{background:#dcebdc}

#panel{
 position:absolute;left:10px;right:10px;bottom:10px;
 max-height:72%;overflow:auto;background:#fffffff2;
 border-radius:20px;padding:16px;z-index:40;
 box-shadow:0 10px 40px #0005;display:none
}
#panel.show{display:block}
#panel h2{margin:0 0 12px;font-size:19px}
.close{
 position:absolute;left:12px;top:10px;width:34px;height:34px;
 border-radius:10px;background:#eee;font-size:18px
}
.card{
 background:#f5f7f5;border-radius:14px;padding:12px;margin:8px 0
}
.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}
.action{
 width:100%;padding:12px;border-radius:12px;background:#173b24;
 color:white;margin-top:7px;font-weight:bold
}
.action.secondary{background:#607d68}
.action.danger{background:#a52d2d}
input{
 width:100%;padding:12px;border:1px solid #ccc;border-radius:11px;
 margin:5px 0;background:white
}
.small{font-size:11px;color:#666;line-height:1.8}
.good{color:#18752c;font-weight:bold}
.bad{color:#a52d2d;font-weight:bold}

#notice{
 position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
 background:#173b24;color:#fff;padding:10px 16px;border-radius:12px;
 z-index:50;display:none;font-size:12px;white-space:nowrap
}
</style>
</head>

<body>
<div id="app">

<canvas id="game"></canvas>

<div id="top">
 <button id="menuBtn">☰</button>

 <div id="stats">
  <div class="stat">🐔 <span id="sChickens">0</span></div>
  <div class="stat">🌾 <span id="sFeed">0</span>kg</div>
  <div class="stat">🥚 <span id="sEggs">0</span></div>
  <div class="stat">🪙 <span id="sCoins">0</span></div>
  <div class="stat">📅 روز <span id="sDay">1</span></div>
 </div>
</div>

<div id="menu">

 <button class="menuItem" data-page="farm">🏡 مزرعه</button>
 <button class="menuItem" data-page="profile">👤 پروفایل من</button>
 <button class="menuItem" data-page="social">👥 اجتماعی</button>
 <button class="menuItem" data-page="ranking">🏆 رتبه‌بندی</button>
 <button class="menuItem" data-page="market">🛒 بازار</button>
 <button class="menuItem" data-page="wallet">💰 کیف پول</button>
 <button class="menuItem" data-page="notifications">🔔 اعلان‌ها</button>
 <button class="menuItem" data-page="referral">🎁 دعوت دوستان</button>
 <button class="menuItem" data-page="settings">⚙️ تنظیمات</button>
 <button class="menuItem" data-page="logout">🚪 خروج</button>

</div>

<div id="panel">
 <button class="close" id="closePanel">×</button>
 <div id="panelContent"></div>
</div>

<div id="notice"></div>

</div>

<script>
/*
========================================================
مرغداری وحید - CLIENT
این فایل عمداً بازیکن یا موجودی فیک تولید نمی‌کند.
تمام اطلاعات اصلی باید از سرور دریافت شود.
========================================================
*/

const API_BASE =
 localStorage.getItem("chicken_api") ||
 "https://YOUR-SERVER-DOMAIN";

let token = localStorage.getItem("chicken_token") || "";
let state = {
 chickens:0,
 feed:0,
 water:0,
 eggs:0,
 coins:0,
 day:1,
 health:100,
 farmName:"",
 username:"",
 eggPrice:1
};

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0;
let player={x:.5,y:.62};
let chickens=[];

function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
 canvas.style.width=innerWidth+"px";
 canvas.style.height=innerHeight+"px";
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",resize);
resize();

function notice(text){
 const n=document.getElementById("notice");
 n.textContent=text;
 n.style.display="block";
 clearTimeout(notice.t);
 notice.t=setTimeout(()=>n.style.display="none",2500);
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;");
}

function setStats(){
 sChickens.textContent=Math.floor(state.chickens);
 sFeed.textContent=Math.floor(state.feed);
 sEggs.textContent=Math.floor(state.eggs);
 sCoins.textContent=Math.floor(state.coins);
 sDay.textContent=state.day;
}

async function api(path,options={}){
 if(!token){
  showLogin();
  throw new Error("AUTH");
 }

 const headers={
  "Content-Type":"application/json",
  ...(options.headers||{}),
  "Authorization":"Bearer "+token
 };

 const r=await fetch(API_BASE+path,{
  ...options,
  headers
 });

 let data=null;
 try{data=await r.json()}catch{}

 if(!r.ok){
  throw new Error(data?.error||"خطا در ارتباط با سرور");
 }

 return data;
}

async function loadMe(){
 try{
  const d=await api("/api/me");
  if(d?.player) state={...state,...d.player};
  if(d?.farm) state={...state,...d.farm};
  setStats();
 }catch(e){
  if(e.message==="AUTH")return;
  notice("سرور هنوز متصل نیست");
 }
}

function showLogin(){
 openPanel(`
 <h2>ورود به مرغداری وحید</h2>

 <div class="card">
  <input id="loginUser" placeholder="ایمیل یا شماره موبایل">
  <input id="loginPass" type="password" placeholder="رمز عبور">
  <button class="action" onclick="login()">ورود</button>
 </div>

 <div class="card">
  <b>حساب جدید</b>
  <input id="regUser" placeholder="ایمیل">
  <input id="regMobile" placeholder="شماره موبایل">
  <input id="regName" placeholder="نام کاربری">
  <input id="regFarm" placeholder="نام مزرعه">
  <input id="regPass" type="password" placeholder="رمز عبور">
  <button class="action" onclick="register()">ثبت‌نام</button>
 </div>

 <div class="small">
 حساب‌ها مستقیماً روی سرور واقعی ثبت می‌شوند.
 </div>
 `);
}

async function login(){
 try{
  const username=document.getElementById("loginUser").value.trim();
  const password=document.getElementById("loginPass").value;

  const d=await fetch(API_BASE+"/api/auth/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username,password})
  }).then(r=>r.json());

  if(!d.token)throw new Error(d.error||"ورود ناموفق بود");

  token=d.token;
  localStorage.setItem("chicken_token",token);

  closePanel();
  await loadMe();
  notice("با موفقیت وارد شدید");
 }catch(e){
  notice(e.message);
 }
}

async function register(){
 try{
  const email=document.getElementById("regUser").value.trim();
  const mobile=document.getElementById("regMobile").value.trim();
  const username=document.getElementById("regName").value.trim();
  const farmName=document.getElementById("regFarm").value.trim();
  const password=document.getElementById("regPass").value;

  if(!email||!mobile||!username||!farmName||!password){
   throw new Error("همه اطلاعات را وارد کنید");
  }

  const d=await fetch(API_BASE+"/api/auth/register",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    email,mobile,username,farmName,password
   })
  }).then(r=>r.json());

  if(!d.token)throw new Error(d.error||"ثبت‌نام ناموفق بود");

  token=d.token;
  localStorage.setItem("chicken_token",token);

  closePanel();
  await loadMe();
  notice("حساب ساخته شد");
 }catch(e){
  notice(e.message);
 }
}

function openPanel(html){
 panel.classList.add("show");
 panelContent.innerHTML=html;
}

function closePanel(){
 panel.classList.remove("show");
}

menuBtn.onclick=()=>{
 menu.classList.toggle("open");
};

closePanel.onclick=closePanel;

document.querySelectorAll(".menuItem").forEach(b=>{
 b.onclick=()=>{
  menu.classList.remove("open");
  openPage(b.dataset.page);
 };
});

function openPage(page){

 if(page==="farm"){
  openPanel(`
   <h2>🏡 مزرعه</h2>
   <div class="card">
    <div class="row"><span>مرغ</span><b>${state.chickens}</b></div>
    <div class="row"><span>خوراک</span><b>${Math.floor(state.feed)} kg</b></div>
    <div class="row"><span>آب</span><b>${Math.floor(state.water)} L</b></div>
    <div class="row"><span>تخم‌مرغ</span><b>${Math.floor(state.eggs)}</b></div>
    <div class="row"><span>سلامت</span><b>${state.health}%</b></div>
   </div>

   <button class="action" onclick="feedMorning()">🌾 خوراک صبح</button>
   <button class="action" onclick="feedEvening()">🌾 خوراک عصر</button>
   <button class="action" onclick="giveWater()">💧 آب</button>
   <button class="action" onclick="collectEggs()">🥚 جمع‌آوری تخم‌مرغ</button>
   <button class="action" onclick="finishDay()">🌙 پایان روز</button>
  `);
 }

 if(page==="profile"){
  openPanel(`
   <h2>👤 پروفایل من</h2>
   <div class="card">
    <div class="row"><span>نام کاربری</span><b>${esc(state.username)}</b></div>
    <div class="row"><span>نام مزرعه</span><b>${esc(state.farmName)}</b></div>
    <div class="row"><span>تعداد مرغ</span><b>${state.chickens}</b></div>
    <div class="row"><span>روز بازی</span><b>${state.day}</b></div>
   </div>
  `);
 }

 if(page==="social"){
  openPanel(`
   <h2>👥 اجتماعی</h2>
   <div class="card">
    <input id="socialSearch" placeholder="جستجوی بازیکن یا مزرعه">
    <button class="action" onclick="searchPlayers()">جستجو</button>
   </div>
   <div id="socialResults"></div>
  `);
 }

 if(page==="ranking"){
  openPanel(`
   <h2>🏆 رتبه‌بندی</h2>
   <div id="rankingBox" class="card">در حال دریافت...</div>
  `);
  loadRanking();
 }

 if(page==="market"){
  openPanel(`
   <h2>🛒 بازار</h2>

   <div class="card">
    <div class="row"><span>قیمت فعلی تخم‌مرغ</span><b>${state.eggPrice||1}</b></div>
    <div class="row"><span>تخم‌مرغ قابل فروش</span><b>${state.eggs}</b></div>
   </div>

   <input id="sellAmount" type="number" min="1" placeholder="تعداد تخم‌مرغ">
   <button class="action" onclick="sellEggs()">فروش</button>

   <div class="card">
    <b>بازار بازیکنان</b>
    <div id="marketListings">در حال دریافت...</div>
   </div>
  `);
  loadMarket();
 }

 if(page==="wallet"){
  openPanel(`
   <h2>💰 کیف پول</h2>
   <div class="card">
    <div class="row"><span>موجودی</span><b>${state.coins}</b></div>
   </div>
   <button class="action" onclick="walletHistory()">تاریخچه تراکنش‌ها</button>
  `);
 }

 if(page==="notifications"){
  openPanel(`
   <h2>🔔 اعلان‌ها</h2>
   <div id="notificationsBox">در حال دریافت...</div>
  `);
  loadNotifications();
 }

 if(page==="referral"){
  openPanel(`
   <h2>🎁 دعوت دوستان</h2>
   <div class="card">
    <p>کد دعوت اختصاصی شما:</p>
    <h2 id="refCode">در حال دریافت...</h2>
   </div>
   <div id="refStats"></div>
  `);
  loadReferral();
 }

 if(page==="settings"){
  openPanel(`
   <h2>⚙️ تنظیمات</h2>
   <button class="action" onclick="logout()">🚪 خروج از حساب</button>
   <button class="action danger" onclick="logoutAll()">خروج از همه دستگاه‌ها</button>
  `);
 }

 if(page==="logout")logout();
}

async function feedMorning(){
 try{
  await api("/api/game/feed",{
   method:"POST",
   body:JSON.stringify({meal:"morning"})
  });
  await loadMe();
  notice("خوراک صبح ثبت شد");
 }catch(e){notice(e.message)}
}

async function feedEvening(){
 try{
  await api("/api/game/feed",{
   method:"POST",
   body:JSON.stringify({meal:"evening"})
  });
  await loadMe();
  notice("خوراک عصر ثبت شد");
 }catch(e){notice(e.message)}
}

async function giveWater(){
 try{
  await api("/api/game/water",{method:"POST"});
  await loadMe();
  notice("آب‌رسانی ثبت شد");
 }catch(e){notice(e.message)}
}

async function collectEggs(){
 try{
  const d=await api("/api/game/collect-eggs",{method:"POST"});
  await loadMe();
  notice("تخم‌مرغ‌ها جمع‌آوری شدند");
 }catch(e){notice(e.message)}
}

async function finishDay(){
 if(!confirm("روز جاری تمام شود؟"))return;

 try{
  await api("/api/game/end-day",{method:"POST"});
  await loadMe();
  notice("روز جدید شروع شد");
 }catch(e){notice(e.message)}
}

async function sellEggs(){
 try{
  const amount=Number(document.getElementById("sellAmount").value);

  if(!amount||amount<1)throw new Error("تعداد را وارد کنید");

  await api("/api/market/sell-eggs",{
   method:"POST",
   body:JSON.stringify({amount})
  });

  await loadMe();
  notice("فروش ثبت شد");
 }catch(e){notice(e.message)}
}

async function searchPlayers(){
 try{
  const q=document.getElementById("socialSearch").value.trim();
  const d=await api("/api/social/search?q="+encodeURIComponent(q));

  const box=document.getElementById("socialResults");

  if(!d.players?.length){
   box.innerHTML='<div class="card">بازیکنی پیدا نشد.</div>';
   return;
  }

  box.innerHTML=d.players.map(p=>`
   <div class="card">
    <b>${esc(p.username)}</b>
    <div class="small">${esc(p.farmName||"")}</div>
    <div class="row">
     <span>مرغ</span><b>${p.chickens}</b>
    </div>
    <button class="action" onclick="followPlayer('${esc(p.id)}')">
     دنبال کردن
    </button>
   </div>
  `).join("");
 }catch(e){notice(e.message)}
}

async function followPlayer(id){
 try{
  await api("/api/social/follow",{
   method:"POST",
   body:JSON.stringify({playerId:id})
  });
  notice("انجام شد");
 }catch(e){notice(e.message)}
}

async function loadRanking(){
 try{
  const d=await api("/api/ranking");

  const box=document.getElementById("rankingBox");

  if(!d.players?.length){
   box.innerHTML="هنوز بازیکن واقعی ثبت نشده است.";
   return;
  }

  box.innerHTML=d.players.map((p,i)=>`
   <div class="row">
    <span>#${i+1} ${esc(p.username)}</span>
    <b>${p.chickens} 🐔</b>
   </div>
  `).join("");
 }catch(e){
  document.getElementById("rankingBox").textContent=e.message;
 }
}

async function loadMarket(){
 try{
  const d=await api("/api/market");

  const box=document.getElementById("marketListings");

  if(!d.listings?.length){
   box.innerHTML="فعلاً آگهی فعالی وجود ندارد.";
   return;
  }

  box.innerHTML=d.listings.map(x=>`
   <div class="card">
    <div>${esc(x.username)}</div>
    <div class="row">
     <span>${x.type}</span>
     <b>${x.amount}</b>
    </div>
    <div class="row">
     <span>قیمت</span>
     <b>${x.price}</b>
    </div>
   </div>
  `).join("");
 }catch(e){
  document.getElementById("marketListings").textContent=e.message;
 }
}

async function loadNotifications(){
 try{
  const d=await api("/api/notifications");

  const box=document.getElementById("notificationsBox");

  if(!d.notifications?.length){
   box.innerHTML='<div class="card">اعلانی ندارید.</div>';
   return;
  }

  box.innerHTML=d.notifications.map(n=>`
   <div class="card">
    <b>${esc(n.title)}</b>
    <div class="small">${esc(n.text)}</div>
   </div>
  `).join("");
 }catch(e){
  document.getElementById("notificationsBox").textContent=e.message;
 }
}

async function loadReferral(){
 try{
  const d=await api("/api/referral");

  refCode.textContent=d.code||"—";

  refStats.innerHTML=`
   <div class="card">
    دعوت موفق: <b>${d.successful||0}</b> از 10
   </div>
  `;
 }catch(e){notice(e.message)}
}

async function walletHistory(){
 try{
  const d=await api("/api/wallet/history");

  openPanel(`
   <h2>💰 تاریخچه کیف پول</h2>
   <div id="walletHistory"></div>
  `);

  walletHistory.innerHTML=(d.transactions||[]).map(x=>`
   <div class="card">
    <div class="row">
     <span>${esc(x.type)}</span>
     <b>${x.amount}</b>
    </div>
    <div class="small">${esc(x.createdAt||"")}</div>
   </div>
  `).join("") || "تراکنشی وجود ندارد.";

 }catch(e){notice(e.message)}
}

async function logout(){
 try{
  if(token){
   await api("/api/auth/logout",{method:"POST"});
  }
 }catch{}

 token="";
 localStorage.removeItem("chicken_token");
 showLogin();
 notice("از حساب خارج شدید");
}

async function logoutAll(){
 try{
  await api("/api/auth/logout-all",{method:"POST"});
  token="";
  localStorage.removeItem("chicken_token");
  showLogin();
 }catch(e){notice(e.message)}
}


/* =========================
   موتور تصویری مزرعه
========================= */

function initChickens(){
 chickens=[];
 for(let i=0;i<Math.min(60,Math.max(10,state.chickens));i++){
  chickens.push({
   x:.20+Math.random()*.60,
   y:.42+Math.random()*.30,
   dx:(Math.random()-.5)*.0005,
   dy:(Math.random()-.5)*.0005
  });
 }
}

function draw(){

 ctx.clearRect(0,0,innerWidth,innerHeight);

 // زمین
 ctx.fillStyle="#8bcf68";
 ctx.fillRect(0,0,innerWidth,innerHeight);

 // جاده
 ctx.fillStyle="#d8c28b";
 ctx.fillRect(0,innerHeight*.72,innerWidth,innerHeight*.16);

 // مزرعه
 ctx.fillStyle="#bfe3a1";
 ctx.fillRect(
  innerWidth*.06,
  innerHeight*.17,
  innerWidth*.88,
  innerHeight*.55
 );

 // مرغداری
 drawBuilding(
  innerWidth*.12,
  innerHeight*.23,
  innerWidth*.34,
  innerHeight*.20,
  "🐔 مرغداری"
 );

 // انبار
 drawBuilding(
  innerWidth*.57,
  innerHeight*.23,
  innerWidth*.30,
  innerHeight*.15,
  "🌾 انبار"
 );

 // سردخانه
 drawBuilding(
  innerWidth*.57,
  innerHeight*.43,
  innerWidth*.30,
  innerHeight*.15,
  "❄️ سردخانه"
 );

 // دفتر
 drawBuilding(
  innerWidth*.12,
  innerHeight*.47,
  innerWidth*.23,
  innerHeight*.13,
  "🏢 دفتر"
 );

 // حصار
 ctx.strokeStyle="#527f3d";
 ctx.lineWidth=5;
 ctx.strokeRect(
  innerWidth*.06,
  innerHeight*.17,
  innerWidth*.88,
  innerHeight*.55
 );

 // مرغ‌ها
 chickens.forEach(c=>{
  c.x+=c.dx;
  c.y+=c.dy;

  if(c.x<.10||c.x>.88)c.dx*=-1;
  if(c.y<.38||c.y>.69)c.dy*=-1;

  drawChicken(c.x*innerWidth,c.y*innerHeight);
 });

 // کاراکتر
 drawPlayer(player.x*innerWidth,player.y*innerHeight);

 requestAnimationFrame(draw);
}

function drawBuilding(x,y,w,h,label){
 ctx.fillStyle="#fff";
 ctx.fillRect(x,y,w,h);

 ctx.fillStyle="#8b4d2c";
 ctx.beginPath();
 ctx.moveTo(x-8,y);
 ctx.lineTo(x+w/2,y-h*.45);
 ctx.lineTo(x+w+8,y);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#173b24";
 ctx.font="bold 13px Tahoma";
 ctx.textAlign="center";
 ctx.fillText(label,x+w/2,y+h*.65);
}

function drawChicken(x,y){
 ctx.font="25px Arial";
 ctx.textAlign="center";
 ctx.fillText("🐔",x,y);
}

function drawPlayer(x,y){
 ctx.beginPath();
 ctx.fillStyle="#173b24";
 ctx.arc(x,y-15,11,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#4d79a8";
 ctx.fillRect(x-9,y-5,18,27);

 ctx.fillStyle="#222";
 ctx.fillRect(x-10,y+22,7,13);
 ctx.fillRect(x+3,y+22,7,13);
}

/* حرکت مستقیم با کشیدن انگشت */
let dragging=false;

canvas.addEventListener("pointerdown",e=>{
 dragging=true;
 moveToPointer(e);
});

canvas.addEventListener("pointermove",e=>{
 if(dragging)moveToPointer(e);
});

canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);

function moveToPointer(e){
 const r=canvas.getBoundingClientRect();

 player.x=Math.max(
  .08,
  Math.min(.92,(e.clientX-r.left)/r.width)
 );

 player.y=Math.max(
  .30,
  Math.min(.75,(e.clientY-r.top)/r.height)
 );
}

initChickens();
draw();

if(token){
 loadMe();
}else{
 setTimeout(showLogin,300);
}

</script>
