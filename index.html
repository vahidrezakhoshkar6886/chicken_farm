<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مرغداری وحید - V21</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#17251b;
  font-family:Tahoma,Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:#73b85d;
}

#topbar{
  position:fixed;
  top:8px;
  left:8px;
  right:8px;
  z-index:10;
  display:flex;
  gap:6px;
  justify-content:center;
  flex-wrap:wrap;
}

.stat{
  background:rgba(20,35,24,.88);
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  padding:7px 10px;
  font-size:12px;
  box-shadow:0 3px 10px #0005;
}

#message{
  position:fixed;
  left:50%;
  top:72px;
  transform:translateX(-50%);
  z-index:20;
  background:rgba(20,35,24,.94);
  color:#fff;
  padding:9px 16px;
  border-radius:14px;
  font-size:13px;
  opacity:0;
  transition:.25s;
  pointer-events:none;
}

#actions{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:15;
  display:flex;
  gap:8px;
}

.action{
  border:0;
  color:#fff;
  background:rgba(24,42,29,.92);
  border-radius:14px;
  padding:11px 13px;
  font-weight:bold;
  font-size:12px;
  box-shadow:0 4px 12px #0006;
}

.action:active{
  transform:scale(.94);
}

#joystick{
  position:fixed;
  left:20px;
  bottom:20px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(20,35,24,.25);
  border:2px solid rgba(255,255,255,.25);
  z-index:20;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(255,255,255,.75);
  left:35px;
  top:35px;
  box-shadow:0 3px 12px #0006;
}

#help{
  position:fixed;
  right:10px;
  bottom:12px;
  z-index:10;
  color:#fff;
  background:#0006;
  border-radius:10px;
  padding:7px 9px;
  font-size:10px;
  max-width:160px;
}

@media(min-width:800px){
  #joystick{
    display:none;
  }

  #help{
    font-size:12px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="topbar">
  <div class="stat">🐔 <span id="chickens">100</span></div>
  <div class="stat">🌾 <span id="feed">100</span> kg</div>
  <div class="stat">💧 <span id="water">100</span></div>
  <div class="stat">🥚 <span id="eggs">0</span></div>
  <div class="stat">🪙 <span id="coins">300</span></div>
  <div class="stat">📅 روز <span id="day">1</span></div>
</div>

<div id="message"></div>

<div id="actions">
  <button class="action" onclick="feedMorning()">🌾 خوراک</button>
  <button class="action" onclick="giveWater()">💧 آب</button>
  <button class="action" onclick="collectEggs()">🥚 جمع‌آوری</button>
  <button class="action" onclick="nextDay()">🌙 پایان روز</button>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="help">
  📱 جوی‌استیک = حرکت<br>
  روی ساختمان‌ها نزدیک شو و دکمه‌های پایین را بزن
</div>

<script>
/* =========================================================
   مرغداری وحید - V21
   نسخه تصویری موبایل
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

addEventListener("resize",resize);
resize();

/* -------------------------
   وضعیت بازی
------------------------- */

let state = JSON.parse(localStorage.getItem("vahid_v21")) || {
  day:1,
  chickens:100,
  feed:100,
  water:100,
  eggs:0,
  coins:300,
  fedToday:false,
  wateredToday:false,
  collectedToday:false,
  totalEggs:0,
  health:100
};

function save(){
  localStorage.setItem("vahid_v21",JSON.stringify(state));
  updateUI();
}

function updateUI(){
  document.getElementById("chickens").textContent=state.chickens;
  document.getElementById("feed").textContent=Math.floor(state.feed);
  document.getElementById("water").textContent=Math.floor(state.water);
  document.getElementById("eggs").textContent=state.eggs;
  document.getElementById("coins").textContent=Math.floor(state.coins);
  document.getElementById("day").textContent=state.day;
}

/* -------------------------
   پیام
------------------------- */

let msgTimer;

function msg(text){
  const el=document.getElementById("message");
  el.textContent=text;
  el.style.opacity=1;

  clearTimeout(msgTimer);

  msgTimer=setTimeout(()=>{
    el.style.opacity=0;
  },1800);
}

/* -------------------------
   جهان بازی
------------------------- */

const world={
  w:2200,
  h:1500
};

const player={
  x:1100,
  y:760,
  speed:4,
  r:18
};

let camera={
  x:0,
  y:0
};

/* -------------------------
   مرغ‌ها
------------------------- */

const chickens=[];

function createChickens(){
  chickens.length=0;

  for(let i=0;i<state.chickens;i++){

    chickens.push({
      x:700+Math.random()*800,
      y:420+Math.random()*650,
      vx:0,
      vy:0,
      timer:Math.random()*100,
      phase:Math.random()*6.28
    });
  }
}

createChickens();

/* -------------------------
   ساختمان‌ها
------------------------- */

const buildings=[
  {
    type:"barn",
    x:720,
    y:250,
    w:520,
    h:230,
    name:"🏠 سالن مرغداری"
  },
  {
    type:"storage",
    x:1450,
    y:300,
    w:350,
    h:220,
    name:"🌾 انبار خوراک"
  },
  {
    type:"cold",
    x:1450,
    y:600,
    w:350,
    h:200,
    name:"❄️ سردخانه"
  },
  {
    type:"office",
    x:350,
    y:350,
    w:300,
    h:200,
    name:"🏢 دفتر مزرعه"
  }
];

/* -------------------------
   کنترل کیبورد
------------------------- */

const keys={};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

/* -------------------------
   جوی‌استیک
------------------------- */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joy={
  active:false,
  x:0,
  y:0
};

function joyMove(clientX,clientY){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  const max=45;
  const d=Math.sqrt(dx*dx+dy*dy);

  if(d>max){
    dx=dx/d*max;
    dy=dy/d*max;
  }

  joy.x=dx/max;
  joy.y=dy/max;

  stick.style.left=(35+dx)+"px";
  stick.style.top=(35+dy)+"px";
}

function joyReset(){
  joy.active=false;
  joy.x=0;
  joy.y=0;
  stick.style.left="35px";
  stick.style.top="35px";
}

joystick.addEventListener("touchstart",e=>{
  joy.active=true;
  const t=e.touches[0];
  joyMove(t.clientX,t.clientY);
},{passive:false});

joystick.addEventListener("touchmove",e=>{
  if(!joy.active)return;
  const t=e.touches[0];
  joyMove(t.clientX,t.clientY);
},{passive:false});

joystick.addEventListener("touchend",joyReset);
joystick.addEventListener("touchcancel",joyReset);

/* -------------------------
   حرکت بازیکن
------------------------- */

function movePlayer(){

  let dx=0;
  let dy=0;

  if(keys["w"]||keys["arrowup"])dy-=1;
  if(keys["s"]||keys["arrowdown"])dy+=1;
  if(keys["a"]||keys["arrowleft"])dx-=1;
  if(keys["d"]||keys["arrowright"])dx+=1;

  if(joy.active){
    dx=joy.x;
    dy=joy.y;
  }

  const len=Math.sqrt(dx*dx+dy*dy);

  if(len>0){
    dx/=len;
    dy/=len;

    const speed=keys["shift"]?7:player.speed;

    player.x+=dx*speed;
    player.y+=dy*speed;
  }

  player.x=Math.max(30,Math.min(world.w-30,player.x));
  player.y=Math.max(30,Math.min(world.h-30,player.y));
}

/* -------------------------
   دوربین
------------------------- */

function updateCamera(){

  camera.x=player.x-W/2;
  camera.y=player.y-H/2;

  camera.x=Math.max(0,Math.min(world.w-W,camera.x));
  camera.y=Math.max(0,Math.min(world.h-H,camera.y));
}

/* -------------------------
   رسم زمین
------------------------- */

function drawGround(){

  ctx.fillStyle="#73b85d";
  ctx.fillRect(0,0,W,H);

  const grid=80;

  ctx.strokeStyle="rgba(255,255,255,.08)";
  ctx.lineWidth=1;

  for(let x=-camera.x%grid;x<W;x+=grid){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=-camera.y%grid;y<H;y+=grid){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  /* جاده */

  ctx.fillStyle="#b99462";

  const roadX=1050-camera.x;

  ctx.fillRect(roadX,0,180,H);
}

/* -------------------------
   ساختمان
------------------------- */

function drawBuilding(b){

  const x=b.x-camera.x;
  const y=b.y-camera.y;

  ctx.fillStyle="#0003";
  ctx.fillRect(x+8,y+12,b.w,b.h);

  if(b.type==="barn"){
    ctx.fillStyle="#c96f45";
  }else if(b.type==="storage"){
    ctx.fillStyle="#d49b42";
  }else if(b.type==="cold"){
    ctx.fillStyle="#6da9cf";
  }else{
    ctx.fillStyle="#777";
  }

  ctx.fillRect(x,y,b.w,b.h);

  /* سقف */

  ctx.fillStyle="rgba(70,45,30,.75)";
  ctx.beginPath();
  ctx.moveTo(x-20,y);
  ctx.lineTo(x+b.w/2,y-70);
  ctx.lineTo(x+b.w+20,y);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.font="bold 17px Tahoma";
  ctx.textAlign="center";
  ctx.fillText(b.name,x+b.w/2,y+b.h/2);

  /* در */

  ctx.fillStyle="#573b29";
  ctx.fillRect(x+b.w/2-35,y+b.h-85,70,85);
}

/* -------------------------
   مرغ
------------------------- */

function drawChicken(c){

  const x=c.x-camera.x;
  const y=c.y-camera.y;

  if(x<-50||x>W+50||y<-50||y>H+50)return;

  ctx.save();
  ctx.translate(x,y);

  /* سایه */

  ctx.fillStyle="#0003";
  ctx.beginPath();
  ctx.ellipse(0,10,18,7,0,0,Math.PI*2);
  ctx.fill();

  /* بدن */

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.ellipse(0,0,17,13,0,0,Math.PI*2);
  ctx.fill();

  /* بال */

  ctx.fillStyle="#ddd";
  ctx.beginPath();
  ctx.ellipse(-4,2,9,7,0,0,Math.PI*2);
  ctx.fill();

  /* سر */

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(14,-9,9,0,Math.PI*2);
  ctx.fill();

  /* تاج */

  ctx.fillStyle="#d83d32";
  ctx.beginPath();
  ctx.arc(14,-17,4,0,Math.PI*2);
  ctx.fill();

  ctx.fillRect(11,-20,3,5);
  ctx.fillRect(15,-20,3,5);

  /* چشم */

  ctx.fillStyle="#111";
  ctx.beginPath();
  ctx.arc(17,-11,2,0,Math.PI*2);
  ctx.fill();

  /* نوک */

  ctx.fillStyle="#e6a63d";
  ctx.beginPath();
  ctx.moveTo(23,-9);
  ctx.lineTo(31,-5);
  ctx.lineTo(23,-3);
  ctx.closePath();
  ctx.fill();

  /* پا */

  ctx.strokeStyle="#d99a38";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(-6,10);
  ctx.lineTo(-6,18);
  ctx.moveTo(5,10);
  ctx.lineTo(5,18);
  ctx.stroke();

  ctx.restore();
}

/* -------------------------
   کاراکتر
------------------------- */

function drawPlayer(){

  const x=player.x-camera.x;
  const y=player.y-camera.y;

  ctx.save();
  ctx.translate(x,y);

  /* سایه */

  ctx.fillStyle="#0004";
  ctx.beginPath();
  ctx.ellipse(0,22,18,8,0,0,Math.PI*2);
  ctx.fill();

  /* بدن */

  ctx.fillStyle="#315e9e";
  ctx.fillRect(-13,-5,26,30);

  /* سر */

  ctx.fillStyle="#f0bd91";
  ctx.beginPath();
  ctx.arc(0,-18,14,0,Math.PI*2);
  ctx.fill();

  /* کلاه */

  ctx.fillStyle="#e2a42d";
  ctx.fillRect(-15,-31,30,7);

  ctx.fillRect(-8,-40,16,10);

  /* پاها */

  ctx.strokeStyle="#333";
  ctx.lineWidth=6;

  ctx.beginPath();
  ctx.moveTo(-7,25);
  ctx.lineTo(-9,38);
  ctx.moveTo(7,25);
  ctx.lineTo(9,38);
  ctx.stroke();

  /* نام */

  ctx.fillStyle="#fff";
  ctx.font="bold 12px Tahoma";
  ctx.textAlign="center";
  ctx.fillText("وحید",0,-50);

  ctx.restore();
}

/* -------------------------
   درخت
------------------------- */

function drawTree(x,y){

  x-=camera.x;
  y-=camera.y;

  ctx.fillStyle="#79512e";
  ctx.fillRect(x-7,y,14,45);

  ctx.fillStyle="#2d843d";

  for(let i=0;i<4;i++){

    ctx.beginPath();

    ctx.arc(
      x+(i%2)*25-12,
      y-10-Math.floor(i/2)*22,
      28,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* -------------------------
   انیمیشن مرغ‌ها
------------------------- */

function updateChickens(){

  for(const c of chickens){

    c.timer-=1;

    if(c.timer<=0){

      c.timer=60+Math.random()*180;

      const a=Math.random()*Math.PI*2;

      c.vx=Math.cos(a)*.5;
      c.vy=Math.sin(a)*.5;
    }

    c.x+=c.vx;
    c.y+=c.vy;

    c.x=Math.max(600,Math.min(1450,c.x));
    c.y=Math.max(480,Math.min(1200,c.y));
  }
}

/* -------------------------
   رندر
------------------------- */

function render(){

  movePlayer();
  updateCamera();
  updateChickens();

  drawGround();

  /* درخت‌ها */

  const trees=[
    [180,200],[300,850],[500,1200],
    [1850,200],[1900,950],[160,1250],
    [2000,1250],[500,650]
  ];

  for(const t of trees)drawTree(t[0],t[1]);

  for(const b of buildings)drawBuilding(b);

  for(const c of chickens)drawChicken(c);

  drawPlayer();

  requestAnimationFrame(render);
}

render();

/* -------------------------
   بررسی وضعیت
------------------------- */

function nearby(type){

  const b=buildings.find(x=>x.type===type);

  if(!b)return false;

  const cx=b.x+b.w/2;
  const cy=b.y+b.h/2;

  return Math.hypot(player.x-cx,player.y-cy)<380;
}

/* -------------------------
   خوراک
------------------------- */

function feedMorning(){

  if(state.fedToday){
    msg("امروز خوراک داده شده است");
    return;
  }

  const need=state.chickens*.05;

  if(state.feed<need){
    msg("❌ خوراک کافی نداری");
    return;
  }

  state.feed-=need;
  state.fedToday=true;

  msg("🌾 خوراک مرغ‌ها داده شد");
  save();
}

/* -------------------------
   آب
------------------------- */

function giveWater(){

  if(state.wateredToday){
    msg("امروز آب داده شده است");
    return;
  }

  const need=state.chickens*.08;

  if(state.water<need){
    msg("❌ آب کافی نیست");
    return;
  }

  state.water-=need;
  state.wateredToday=true;

  msg("💧 آب مرغ‌ها تأمین شد");
  save();
}

/* -------------------------
   تخم‌مرغ
------------------------- */

function collectEggs(){

  if(!state.fedToday){
    msg("⚠️ اول به مرغ‌ها خوراک بده");
    return;
  }

  if(!state.wateredToday){
    msg("⚠️ اول آب مرغ‌ها را تأمین کن");
    return;
  }

  if(state.collectedToday){
    msg("🥚 تخم‌مرغ امروز قبلاً جمع شده");
    return;
  }

  let production=Math.floor(state.chickens*.8);

  if(state.health<100){
    production=Math.floor(production*(state.health/100));
  }

  state.eggs+=production;
  state.totalEggs+=production;
  state.collectedToday=true;

  msg("🥚 "+production+" تخم‌مرغ جمع شد");
  save();
}

/* -------------------------
   فروش تخم‌مرغ
------------------------- */

function sellEggs(){

  if(state.eggs<=0){
    msg("تخم‌مرغی برای فروش نداری");
    return;
  }

  const price=1;
  const money=state.eggs*price;

  state.coins+=money;

  msg("💰 "+state.eggs+" تخم‌مرغ فروخته شد");

  state.eggs=0;

  save();
}

/* -------------------------
   پایان روز
------------------------- */

function nextDay(){

  if(!state.fedToday){

    state.health=Math.max(0,state.health-30);

    msg("⚠️ خوراک امروز کامل انجام نشد");
  }

  if(!state.wateredToday){

    state.health=Math.max(0,state.health-30);

    msg("⚠️ آب امروز کامل انجام نشد");
  }

  if(state.fedToday && state.wateredToday){

    state.health=Math.min(100,state.health+2);
  }

  state.day++;

  state.fedToday=false;
  state.wateredToday=false;
  state.collectedToday=false;

  save();

  setTimeout(()=>{
    msg("🌅 روز "+state.day+" شروع شد");
  },500);
}

/* -------------------------
   دکمه فروش با نگه داشتن
------------------------- */

document.getElementById("actions")
  .insertAdjacentHTML(
    "beforeend",
    '<button class="action" onclick="sellEggs()">💰 فروش</button>'
  );

/* -------------------------
   ذخیره اولیه
------------------------- */

updateUI();

/* -------------------------
   ذخیره خودکار
------------------------- */

setInterval(save,10000);

</script>

</body>
                           </html>
